<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3396" />
      <stop offset="100%" stop-color="#202472" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BAF2" />
      <stop offset="100%" stop-color="#0092D8" />
    </linearGradient>
  </defs>

  <!-- Scaled comfortably (scale 0.76) around center (256, 256) so the entire logo is 100% visible inside app icon safe-zone masks -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- Blue Rounded Document Card -->
    <rect
      x="194"
      y="128"
      width="230"
      height="266"
      rx="48"
      ry="48"
      fill="url(#cardGrad)"
    />

    <!-- The Continuous Cyan Ribbon (Flows directly from arrow stem around card) -->
    <path
      d="M 308 310
         L 308 342
         C 308 398 262 436 196 436
         L 164 436
         A 58 58 0 0 1 106 378
         L 106 146
         A 58 58 0 0 1 164 88
         L 378 88"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="34"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- The Upload Arrow with Clean White Outer Stroke -->
    <path
      d="M 308 206
         L 234 280
         L 274 280
         L 274 340
         L 342 340
         L 342 280
         L 382 280
         Z"
      fill="url(#cardGrad)"
      stroke="#FFFFFF"
      stroke-width="19"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
